# Prometheus configuration for a 3-broker Tributary cluster. Each broker serves its
# metrics with --metrics-port 9404 (see the docker compose setup in deploy/).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: tributary
    static_configs:
      - targets: ["broker-1:9404", "broker-2:9404", "broker-3:9404"]
